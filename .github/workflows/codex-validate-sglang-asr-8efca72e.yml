name: Validate SGLang ASR 8efca72e

on:
  push:
    branches: [codex-validate/sglang-asr-8efca72e]

permissions:
  contents: read

jobs:
  cpu:
    if: github.repository == 'GoldArowana/sglang' && github.ref == 'refs/heads/codex-validate/sglang-asr-8efca72e'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GIT_TERMINAL_PROMPT: "0"
      SOURCE_SHA: c59dfc02ccf01d2543036a7747cf3b4f6d305baa
      SOURCE_TREE: f5617633529d175e07fc0d7ef4fbee622a142b2f
      TEST_FILE: test/registered/unit/entrypoints/openai/test_serving_transcription.py
    steps:
      - name: Check out and verify exact upstream source
        shell: bash
        timeout-minutes: 6
        run: |
          set -Eeuo pipefail
          test "$GITHUB_EVENT_NAME" = push
          git init --quiet verified-source
          cd verified-source
          git fetch --no-tags --depth=1 https://github.com/sgl-project/sglang.git "$SOURCE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test -z "$(git status --porcelain --untracked-files=all)"
          printf 'Verified upstream source %s tree %s\n' "$SOURCE_SHA" "$SOURCE_TREE"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: false

      - name: Install upstream CPU dependencies
        shell: bash
        working-directory: verified-source
        timeout-minutes: 23
        env:
          UV_SYSTEM_PYTHON: "1"
        run: |
          set -Eeuo pipefail
          bash scripts/ci/utils/install_rust_protoc.sh
          uv pip install -e 'python[dev]' --index-strategy unsafe-best-match --prerelease allow
          git diff HEAD --exit-code

      - name: Run registered transcription tests and public-handler observation
        shell: bash
        working-directory: verified-source
        timeout-minutes: 9
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          SGLANG_IS_IN_CI: "true"
        run: |
          set -Eeuo pipefail
          python3 - <<'PYVERIFY'
          import importlib.util
          import sys
          from pathlib import Path
          import torch
          assert sys.version_info[:2] == (3, 12)
          assert not torch.cuda.is_available()
          origin = Path(importlib.util.find_spec("sglang").origin).resolve()
          assert origin == (Path.cwd() / "python/sglang/__init__.py").resolve(), origin
          print(f"Python {sys.version.split()[0]}, torch {torch.__version__}, source {origin}")
          PYVERIFY
          direct_log="$RUNNER_TEMP/transcription-direct.log"
          python3 "$TEST_FILE" 2>&1 | tee "$direct_log"
          grep -E '^Ran [1-9][0-9]* tests? in ' "$direct_log"
          printf '%s\n' "$TEST_FILE" > "$RUNNER_TEMP/transcription-files.txt"
          python3 test/run_suite.py --hw cpu --suite base-a-test-cpu --only-file-list "$RUNNER_TEMP/transcription-files.txt" --max-attempts 1 2>&1 | tee "$RUNNER_TEMP/transcription-dispatch.log"
          grep -F 'Test Summary: 1/1 passed' "$RUNNER_TEMP/transcription-dispatch.log"
          cat > "$RUNNER_TEMP/installed_asr_probe.py" <<'PYASR'
          """Observe terminal metadata through the installed transcription handler."""

          import asyncio
          import io
          import json
          import runpy
          import wave
          from pathlib import Path
          from unittest.mock import AsyncMock, Mock

          from fastapi.responses import StreamingResponse

          from sglang.srt.entrypoints.openai.serving_transcription import (
              OpenAIServingTranscription,
          )
          from sglang.srt.runtime_context import publish, reset_context
          from sglang.srt.server_args import ServerArgs


          def audio(seconds):
              buffer = io.BytesIO()
              with wave.open(buffer, "wb") as wav:
                  wav.setnchannels(1)
                  wav.setsampwidth(2)
                  wav.setframerate(16000)
                  wav.writeframes(bytes(16000 * seconds * 2))
              return buffer.getvalue()


          async def observe(manager_type, name, replies, expected_reason, transcript):
              reset_context()
              publish(ServerArgs(model_path="dummy", asr_max_concurrent_sessions=32), role="tokenizer")
              try:
                  engine = manager_type(
                      [
                          [
                              {
                                  "text": text,
                                  "meta_info": {
                                      "finish_reason": (
                                          {"type": reason, "length": 256} if reason else None
                                      ),
                                      "completion_tokens": 256,
                                  },
                              }
                          ]
                          for text, reason in replies
                      ]
                  )
                  engine.model_config.hf_config.architectures = [
                      "Qwen3ASRForConditionalGeneration"
                  ]
                  raw = Mock()
                  raw.headers = {}
                  raw.is_disconnected = AsyncMock(return_value=False)
                  serving = OpenAIServingTranscription(engine)
                  response = await serving.create_transcription(
                      audio_data=audio(2 * len(replies) - 1),
                      model="Qwen/Qwen3-ASR-0.6B",
                      language="en",
                      response_format="json",
                      temperature=0.0,
                      stream=True,
                      raw_request=raw,
                  )
                  assert isinstance(response, StreamingResponse), type(response).__name__
                  assert response.media_type == "text/event-stream"
                  frames = [chunk async for chunk in response.body_iterator]
                  assert frames.count("data: [DONE]\n\n") == 1 and frames[-1].strip() == "data: [DONE]"
                  choices = [
                      choice
                      for frame in frames[:-1]
                      for choice in json.loads(frame.removeprefix("data: "))["choices"]
                  ]
                  assert "".join(choice["delta"].get("content") or "" for choice in choices) == transcript
                  assert len(engine.requests) == len(replies)
                  assert all(req.stream is False for req in engine.requests)
                  assert all(req.sampling_params["max_new_tokens"] == 256 for req in engine.requests)
                  terminal = [choice["finish_reason"] for choice in choices if choice["finish_reason"]]
                  assert len(terminal) == 1, terminal
                  return {"scenario": name, "expected": expected_reason, "observed": terminal[0]}
              finally:
                  reset_context()


          async def main():
              test_path = Path("test/registered/unit/entrypoints/openai/test_serving_transcription.py")
              manager_type = runpy.run_path(str(test_path))["_MockChunkTokenizerManager"]
              prefix = "one two three four five six"
              final = prefix + " seven"
              cases = [
                  ("first prefix truncated", [("partial text", "length")], "length", "partial text"),
                  ("final prefix truncated", [(prefix, "stop"), (final, "length")], "length", final),
                  ("provisional truncation recovered", [(prefix, "length"), (final, "stop")], "stop", final),
                  ("clean stop", [("language en<asr_text>complete text", "stop")], "stop", "complete text"),
                  ("metadata absent", [("fallback text", None)], "stop", "fallback text"),
              ]
              observed = [await observe(manager_type, *case) for case in cases]
              print(json.dumps(observed, indent=2))
              mismatches = {row["scenario"] for row in observed if row["expected"] != row["observed"]}
              assert mismatches == {"first prefix truncated", "final prefix truncated"}, mismatches


          if __name__ == "__main__":
              asyncio.run(main())
          PYASR
          python3 "$RUNNER_TEMP/installed_asr_probe.py"

      - name: Verify tracked source after validation
        if: always()
        shell: bash
        timeout-minutes: 2
        run: |
          set -Eeuo pipefail
          test -d verified-source/.git
          cd verified-source
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          git diff HEAD --exit-code
