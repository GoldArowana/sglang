      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      SGLANG_IS_IN_CI: "true"
      BASE_SHA: 07a17a305cf017ccc7995d2bf23841ec9e219d44
      BASE_TREE: 63917a61267a248f966b6118fdb3f4396c76df53
      HEAD_SHA: 641d698fa5f90b2f78cfcbff1931b5d18c8c63f3
      HEAD_TREE: 5865598d954db26968e669cf714af6ab00975bcd
      SERVING_FILE: python/sglang/srt/entrypoints/openai/serving_transcription.py
      HELPER_FILE: python/sglang/srt/entrypoints/openai/streaming_asr.py
      TEST_FILE: test/registered/unit/entrypoints/openai/test_serving_transcription.py
