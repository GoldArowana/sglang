        with:
          python-version: "3.12"

      - name: Set up official lint's Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Install pre-commit and check the official runner tools
        shell: bash
        working-directory: verified-source
        timeout-minutes: 6
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          matches="$(git ls-files -- docs_new)"
          test -z "$matches"
          python3 --version
          node --version
          rustc --version
          cargo clippy --version
          cargo fmt --version
          python3 -m pip install 'pre-commit==4.5.1'
          pre-commit --version
          pre-commit install

      - name: Run the official all-files pre-commit command on the candidate
        shell: bash
        working-directory: verified-source
        timeout-minutes: 30
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$HEAD_TREE"
          SKIP=no-commit-to-branch pre-commit run --all-files --show-diff-on-failure
          git diff HEAD --exit-code
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$HEAD_TREE"
