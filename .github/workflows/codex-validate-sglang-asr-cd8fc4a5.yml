        shell: bash
        working-directory: verified-source
        timeout-minutes: 10
        env:
          UV_SYSTEM_PYTHON: "1"
        run: |
          set -Eeuo pipefail
          uv pip install 'pre-commit==4.5.1'
          pre-commit run --files "$SERVING_FILE" "$HELPER_FILE" "$TEST_FILE" --show-diff-on-failure
          git diff HEAD --exit-code
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$HEAD_TREE"
