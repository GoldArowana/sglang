      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: false

      - name: Install upstream CPU dependencies
        shell: bash
        working-directory: verified-source
        timeout-minutes: 24
        env:
          UV_SYSTEM_PYTHON: "1"
        run: |
          set -Eeuo pipefail
          bash scripts/ci/utils/install_rust_protoc.sh
          uv pip install -e 'python[dev]' --index-strategy unsafe-best-match --prerelease allow
          git diff HEAD --exit-code
          python3 - <<'PYVERIFY'
          import importlib.util
          import sys
          from pathlib import Path
          import torch

          assert sys.version_info[:2] == (3, 12)
          assert not torch.cuda.is_available()
          origin = Path(importlib.util.find_spec("sglang").origin).resolve()
          assert origin == (Path.cwd() / "python/sglang/__init__.py").resolve(), origin
          print(f"Python {sys.version.split()[0]}, torch {torch.__version__}, source {origin}")
          PYVERIFY

      - name: Run the same regression on base and candidate
        shell: bash
        working-directory: verified-source
        timeout-minutes: 13
        run: |
          set -Eeuo pipefail
          baseline_log="$RUNNER_TEMP/asr-baseline.log"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$BASE_TREE"
          python3 "$TEST_FILE"
          probe_exit=0
          python3 "$RUNNER_TEMP/asr_regression.py" TestCumulativeASRStream.test_finish_reason_follows_final_prefix > "$baseline_log" 2>&1 || probe_exit=$?
          cat "$baseline_log"
          test "$probe_exit" = 1
          grep '^FAIL:' "$baseline_log" | tee "$RUNNER_TEMP/asr-baseline-failures.txt"
          test "$(wc -l < "$RUNNER_TEMP/asr-baseline-failures.txt")" = 3
          for scenario in 'single prefix truncated' 'final prefix truncated' 'empty prefix truncated'; do
            grep -F "(name='$scenario')" "$RUNNER_TEMP/asr-baseline-failures.txt"
          done
          grep -F 'FAILED (failures=3)' "$baseline_log"
          git diff HEAD --exit-code

          git checkout --quiet --detach "$HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$HEAD_TREE"
          cmp "$RUNNER_TEMP/asr_regression.py" "$TEST_FILE"
          python3 "$TEST_FILE" 2>&1 | tee "$RUNNER_TEMP/asr-head-direct.log"
          grep -E '^Ran [1-9][0-9]* tests? in ' "$RUNNER_TEMP/asr-head-direct.log"
          printf '%s\n' "$TEST_FILE" > "$RUNNER_TEMP/asr-files.txt"
          python3 test/run_suite.py --hw cpu --suite base-a-test-cpu --only-file-list "$RUNNER_TEMP/asr-files.txt" --max-attempts 1 2>&1 | tee "$RUNNER_TEMP/asr-head-dispatch.log"
          grep -F 'Test Summary: 1/1 passed' "$RUNNER_TEMP/asr-head-dispatch.log"
          git diff HEAD --exit-code

